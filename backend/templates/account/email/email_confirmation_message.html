<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Verify your email - FounderStack</title>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #f9f9f8;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            color: #111827;
            -webkit-font-smoothing: antialiased;
        "
    >
        <table
            border="0"
            cellpadding="0"
            cellspacing="0"
            width="100%"
            style="background-color: #f9f9f8; padding: 60px 20px"
        >
            <tr>
                <td align="center">
                    <table
                        border="0"
                        cellpadding="0"
                        cellspacing="0"
                        width="100%"
                        style="
                            max-width: 480px;
                            background-color: #ffffff;
                            border: 1px solid #e5e7eb;
                            border-radius: 40px;
                            overflow: hidden;
                            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
                        "
                    >
                        <!-- Header / Logo -->
                        <tr>
                            <td align="center" style="padding: 48px 40px 0 40px">
                                <span style="font-size: 24px; font-weight: 700; letter-spacing: -0.02em; color: #111827;">FounderStack</span>
                            </td>
                        </tr>

                        <!-- Content -->
                        <tr>
                            <td align="center" style="padding: 40px 40px 48px 40px">
                                <h1 style="margin: 0 0 16px 0; font-size: 30px; font-weight: 600; color: #111827; letter-spacing: -0.02em;">
                                    Verify your email
                                </h1>
                                <p style="margin: 0 0 40px 0; font-size: 18px; line-height: 28px; color: #6b7280;">
                                    Click the button below to verify your account and get started with FounderStack.
                                </p>

                                <!-- Action Button -->
                                <table border="0" cellpadding="0" cellspacing="0" style="margin: 0 auto">
                                    <tr>
                                        <td align="center" bgcolor="#3b82f6" style="border-radius: 16px">
                                            <a
                                                href="{{ activate_url }}"
                                                target="_blank"
                                                style="
                                                    display: inline-block;
                                                    padding: 18px 40px;
                                                    font-size: 18px;
                                                    font-weight: 600;
                                                    color: #ffffff;
                                                    text-decoration: none;
                                                    border-radius: 16px;
                                                "
                                            >
                                                Verify Email Address
                                            </a>
                                        </td>
                                    </tr>
                                </table>

                                <!-- Footer Text inside card -->
                                <div style="margin-top: 48px; padding-top: 32px; border-top: 1px solid #f3f4f6;">
                                    <p style="margin: 0; font-size: 14px; line-height: 20px; color: #9ca3af;">
                                        If you didn't request this email, you can safely ignore it.<br />
                                        If you're experiencing issues, please contact <a href="https://t.me/Omar_Gatara" style="color: #4b5563; text-decoration: underline;">Support</a>.
                                    </p>
                                </div>
                            </td>
                        </tr>
                    </table>

                    <!-- System Footer -->
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 480px; margin-top: 32px">
                        <tr>
                            <td align="center">
                                <p style="margin: 0; font-size: 12px; color: #9ca3af; text-transform: uppercase; letter-spacing: 0.1em; font-weight: 500;">
                                    &copy; 2026 FounderStack CRM
                                </p>
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
